/* Constantia: full file only for rare glyphs (Greek, Cyrillic, extended Latin, symbols);
   the small Latin subset below covers all current text, so normally only it downloads. */
@font-face{
  font-family:'Constantia';
  src:url('Constantia.woff2') format('woff2'), url('Constantia.woff') format('woff'), url('Constantia.ttf') format('truetype');

*{ box-sizing:border-box; }

html{
  /* Fallback only (seen if Safari ever paints its own band): image edge colors, never gray */
  background:#c3ae92 linear-gradient(180deg,#c3ae92 0%,#595737 100%);
  position:relative;
}

/* ===== Background — identical in index / menu / store =====
   iOS 26 Safari never draws position:fixed layers under its status bar / bottom toolbar
   (it fills those strips with one flat color). Only normal document content shows there.
   So the background has two layers, both sized ONLY from viewport units (never from
   content height, language or RTL/LTR), so they have the same scale and framing:
   - .bg-layer (fixed): the stationary background you see while scrolling.
   - .bg-doc (absolute, part of the document): sits behind it and is what Safari shows
     under its status bar / toolbar.
   On iOS only, a small top runway (--rw) + bottom bleed (--bl) give that document layer
   room to sit under the bars; a tiny script starts the page at scrollY = --rw, so the
   first screen looks exactly as before. */
:root{
  --bg-img:url('background.webp');
  --bg-w:max(100vw, calc(100lvh * 0.5625));   /* = cover width for a 1080x1920 image */
  --rw:0px;
  --bl:0px;
}
@supports (-webkit-touch-callout:none){        /* iPhone / iPad Safari only */
  :root{ --rw:72px; --bl:120px; }
  /* A fixed full-screen layer makes iOS 26 Safari paint a flat color strip under its
     status bar / toolbar ON TOP of .bg-doc. Removed completely (display:none, not
     opacity) so Safari shows the real image (.bg-doc) under its bars instead. */
  .bg-layer{ display:none; }
}
.bg-layer{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  direction:ltr;
}
.bg-layer-img{
  position:absolute;
  top:0; left:0; right:0;
  height:100vh;
  height:100lvh;
  min-height:100%;
  background:var(--bg-img) center top / cover no-repeat;
}
.bg-doc{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  z-index:-2;
  pointer-events:none;
  direction:ltr;
  background:
    var(--bg-img) center top / var(--bg-w) auto no-repeat,
    var(--bg-img) center bottom / var(--bg-w) auto no-repeat,
    #595737;
}

body{
  margin:var(--rw) 0 var(--bl);
  background:transparent;
  overflow-x:hidden;
  min-height:100svh;
  font-family:'Constantia', serif;
  color:#fff;
  display:flex;
  justify-content:center;
  padding: 40px 20px 50px;
}

.wrap{ width:100%; max-width:460px; position:relative; }
a{ text-decoration:none; color:inherit; }

/* Language toggle (fixed position, sliding thumb) */
.lang-toggle{
  position:fixed;
  top:16px;
  right:16px;
  z-index:50;
  direction:ltr;
  -webkit-transform: translateZ(0);
  transform: translateZ(0);
}
.lang-toggle-inner{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  background: rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.45);
  border-radius:999px;
  padding:4px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.lang-thumb{
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc((100% - 8px) / 2);
  border-radius:999px;
  background:#fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  transform: translateX(0);
  transition: transform .3s cubic-bezier(.65,0,.35,1);
  will-change: transform;
  pointer-events:none;
}
.lang-toggle[data-lang="ar"] .lang-thumb{ transform: translateX(100%); }
.lang-toggle.no-anim .lang-thumb,
.lang-toggle.no-anim .lang-btn{ transition:none !important; }
.lang-btn{
  position:relative;
  z-index:1;
  border:none;
  background:transparent;
  color:#fff;
  font-family:'Constantia', serif;
  font-size:13px;
  letter-spacing:.3px;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .2s ease;
}
.lang-btn.active{
  color:#2a1a10;
  font-weight:bold;
}

/* Back to home */
.back-btn{
  position:fixed;
  top:16px;
  left:16px;
  direction:ltr;
  z-index:50;
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 14px 9px 10px;
  border-radius:999px;
  font-size:14px;
  color:#fff;
  background: rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.back-btn svg{ width:16px; height:16px; }
.back-btn{ transition: transform .15s ease; }
.back-btn:active{ transform: scale(.96); transition-duration:0s; }

.crest{

}

.card{

.headline{

/* Notify form */
.notify{ display:flex; flex-direction:column; gap:14px; margin-bottom:24px; }

.email-input{

.notify-btn{

  padding: 17px 20px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.35);
  font-family:'Constantia', serif;
  font-size:19px;
  color:#fff;
  cursor:pointer;
  background: linear-gradient(180deg, rgba(214,161,90,.9), rgba(198,133,60,.9));
  box-shadow: 0 8px 18px rgba(0,0,0,.18);
  transition: transform .15s ease, opacity .15s ease;
}
.notify-btn:active{ transform: scale(.98); transition-duration:0s; }
.notify-btn:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
.notify-btn:disabled{ opacity:.65; cursor:default; transform:none; }

/* Honeypot field (hidden from real people, catches bots) */
.hp{ position:absolute; width:0; height:0; padding:0; border:0; margin:0; opacity:0; overflow:hidden; pointer-events:none; }

.status{
  min-height:22px;
  margin:0;
  font-size:15px;
  line-height:1.5;

  text-shadow: 0 1px 6px rgba(0,0,0,.45);
}
.status.error{ color:#ffd9d2; }

.socials{

}
.social-btn{

}
.social-btn img{ width:100%; height:100%; object-fit:cover; }

.footer-pill{

@media (max-width:380px){
  .notify-btn{ font-size:17px; }
}

/* ===== Tap feedback (performance pass) =====
   Press state applies instantly (0s); only the release eases back. No delay before navigation. */
a, button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
.social-btn{ transition: transform .15s ease; }
.social-btn:active{ transform: scale(.94); transition-duration:0s; }
.lang-btn:active{ opacity:.7; }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; }
}

/* ===== Arabic / RTL mode ===== */
html.lang-ar body{ direction: rtl; }
html.lang-ar .headline{ font-family:'ArefRuqaa','Amiri', serif; line-height:1.4; }

html.lang-ar .status,

html.lang-ar .notify-btn{ font-family:'Amiri', serif; }
</style>
</head>

<script>
/* ============================================================
   DATABASE SETTINGS (same values as in admin.html)
   Use the "anon public" key only. Never put the service_role key here.
   ============================================================ */
var SUPABASE_URL      = "https://yayodgunqopagdzsvqno.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_GHqEYKYOTTyfuVnH9AeXjQ_dN6xLNgK";

var translations = {
  en: {
    title: "Our Store — Coming Soon | TEA ESTATE",
    headline: "Coming Soon",
    subhead: "A New Artisan Experience",
    placeholder: "Email Address",
    button: "Notify Me",
    sending: "Sending...",
    back: "Back",
    footer: "2026 Powered by TEA ESTATE COMPANY",
    invalid: "Please enter a valid email address.",
    success: "Thank you! We will email you as soon as our store opens.",
    failure: "Something went wrong. Please try again in a moment."
  },
  ar: {
    title: "المتجر — قريباً | تي استيت",
    headline: "قريباً",
    subhead: "تجربة حرفية جديدة",
    placeholder: "البريد الإلكتروني",
    button: "أبلغني",
    sending: "جاري الإرسال...",
    back: "رجوع",
    footer: "يتم تشغيله بواسطة شركة تي استيت 2026",
    invalid: "الرجاء إدخال بريد إلكتروني صحيح.",
    success: "شكراً لك! بنرسل لك إشعار أول ما يفتح المتجر.",
    failure: "صار خطأ، حاول مرة ثانية بعد قليل."
  }
};

var currentLang = 'en';
var lastStatusKey = '';

function setStatus(key, isError){
  var el = document.getElementById('status');
  lastStatusKey = key || '';
  el.textContent = key ? translations[currentLang][key] : '';
  el.classList.toggle('error', !!isError);
}

function setLang(lang){
  currentLang = translations[lang] ? lang : 'en';
  var t = translations[currentLang];

  document.title = t.title;
  document.getElementById('headline').textContent = t.headline;
  document.getElementById('subhead').textContent = t.subhead;
  document.getElementById('email').placeholder = t.placeholder;
  document.getElementById('email').setAttribute('aria-label', t.placeholder);
  document.getElementById('notifyBtn').textContent = t.button;
  document.getElementById('txt-back').textContent = t.back;
  document.getElementById('txt-footer').textContent = t.footer;

  document.documentElement.lang = currentLang;
  document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
  document.documentElement.classList.toggle('lang-ar', currentLang === 'ar');

  document.getElementById('langToggle').setAttribute('data-lang', currentLang);
  document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', currentLang === 'ar');

  if (lastStatusKey && lastStatusKey !== 'sending') {
    setStatus(lastStatusKey, document.getElementById('status').classList.contains('error'));
  }

  try{ localStorage.setItem('teaEstateLang', currentLang); }catch(e){}
}

document.getElementById('notifyForm').addEventListener('submit', function(e){
  e.preventDefault();

  var email = document.getElementById('email').value.trim();
  var btn = document.getElementById('notifyBtn');

  // Bots fill the hidden field; pretend success and stop.
  if (document.getElementById('hp').value) { setStatus('success', false); return; }

  var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
  if (!ok) { setStatus('invalid', true); document.getElementById('email').focus(); return; }

  if (SUPABASE_URL.indexOf('https://') !== 0) {
    console.error('store.html: fill in SUPABASE_URL and SUPABASE_ANON_KEY before publishing.');
    setStatus('failure', true);
    return;
  }

  btn.disabled = true;
  btn.textContent = translations[currentLang].sending;
  setStatus('', false);

  var hdrs = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Prefer': 'return=minimal' };
  // Old-style anon keys (start with eyJ) are JWTs and go in Authorization too; new sb_publishable keys do not.
  if (SUPABASE_ANON_KEY.indexOf('eyJ') === 0) { hdrs['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY; }

  fetch(SUPABASE_URL + '/rest/v1/subscribers', {
    method: 'POST',
    headers: hdrs,
    body: JSON.stringify({ email: email.toLowerCase(), lang: currentLang, source: 'store-coming-soon' })
  }).then(function(res){
    // 409 = this email is already registered: show success anyway
    if (res.ok || res.status === 409) {
      document.getElementById('email').value = '';
      setStatus('success', false);
    } else if (res.status === 400) {
      setStatus('invalid', true);
    } else {
      throw new Error('HTTP ' + res.status);
    }
  }).catch(function(){
    setStatus('failure', true);
  }).then(function(){
    btn.disabled = false;
    btn.textContent = translations[currentLang].button;
  });
});

(function init(){
  var saved = null;
  try{ saved = localStorage.getItem('teaEstateLang'); }catch(e){}
  if (!saved) {
    saved = (navigator.language || 'en').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
  }
  var tg = document.getElementById('langToggle');
  tg.classList.add('no-anim');
  setLang(saved);
  void tg.offsetWidth;
  tg.classList.remove('no-anim');
})();
</script>

<script>
/* iOS: start just below the top runway so the background sits under Safari's status bar.
   Re-applied after load (some browsers reset scroll at load end), never after the user touches the page. */
(function(){
  var touched = false;
  var r = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rw')) || 0;  /* read once */
  function toRunway(){
    if(touched || !(r > 0)) return;
    if((window.scrollY || window.pageYOffset) < r) window.scrollTo(0, r);
  }
  window.addEventListener('touchstart', function(){ touched = true; }, {passive:true, once:true});
  document.addEventListener('touchstart', function(){}, {passive:true});
  toRunway();
  window.addEventListener('load', function(){ toRunway(); setTimeout(toRunway, 80); setTimeout(toRunway, 300); });
  window.addEventListener('pageshow', function(e){ if(e.persisted){ touched = false; } toRunway(); });
})();
</script>
<script>
(function(){
  function warm(){
    if(!document.fonts || !document.fonts.load) return;
    var c = navigator.connection; if(c && (c.saveData || /2g/.test(c.effectiveType||''))) return;
    ['16px Amiri','16px ArefRuqaa','16px Froadmile','16px Constantia'].forEach(function(f){
      document.fonts.load(f, f.indexOf('Amiri')>0||f.indexOf('Aref')>0 ? '\u0639' : 'A').catch(function(){});
    });
  }
  function later(){ (window.requestIdleCallback || function(f){ setTimeout(f, 1200); })(warm, {timeout:3000}); }
  if(document.readyState === 'complete') later(); else window.addEventListener('load', later);
})();
</script>
