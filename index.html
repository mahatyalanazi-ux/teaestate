<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEA ESTATE — Finest Artisan Blends</title>
<meta name="description" content="Premium teas, artisanal pizzas, and specialty coffee. Menu, location and support for TEA ESTATE, Riyadh.">

<style>
@font-face{
  font-family:'Froadmile';
  src:url('Froadmile.ttf') format('truetype');
  font-display:swap;
}
@font-face{
  font-family:'Constantia';
  src:url('Constantia.ttf') format('truetype');
  font-display:swap;
}

:root{
  --ink:#2a1a10;
  --gold:#c8973f;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100svh;
  font-family:'Constantia', serif;
  color:#fff;
  background:#8a8f86 url('background.jpg') center top / cover no-repeat fixed;
  display:flex;
  justify-content:center;
  padding: 40px 20px 50px;
}

.wrap{ width:100%; max-width:460px; }
a{ text-decoration:none; color:inherit; }

.crest{
  display:block;
  width: min(72%, 300px);
  margin: 4px auto -46px;
  filter: drop-shadow(0 12px 20px rgba(20,15,5,.35));
  position:relative;
  z-index:2;
}

.card{
  position:relative;
  z-index:1;
  padding: 70px 26px 34px;
  border-radius: 34px;
  background: linear-gradient(180deg, rgba(120,110,95,.42), rgba(90,82,70,.5));
  border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  text-align:center;
}

.headline{
  font-family:'Froadmile', 'Constantia', serif;
  font-size: clamp(30px, 8vw, 42px);
  line-height:1.15;
  color:#1c130a;
  margin: 0 0 18px;
  text-shadow: 0 1px 0 rgba(255,255,255,.15);
}

.tagline{
  font-size: clamp(12px, 4vw, 17px);
  letter-spacing:.2px;
  color:#fdf6ea;
  margin: 0 0 28px;
  text-shadow: 0 1px 6px rgba(0,0,0,.35);
  white-space: nowrap;
}

.links{ display:flex; flex-direction:column; gap:16px; margin-bottom: 26px; }

.link-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding: 18px 20px;
  border-radius: 999px;
  font-family:'Constantia', serif;
  font-size: 19px;
  color:#fff;
  background: linear-gradient(180deg, rgba(214,161,90,.85), rgba(198,133,60,.85));
  border: 1px solid rgba(255,255,255,.35);
  box-shadow: 0 8px 18px rgba(0,0,0,.18);
  transition: transform .15s ease, box-shadow .15s ease;
}
.link-btn:active{ transform: scale(.98); }

.link-btn .badge{
  position:absolute;
  left: 20px;
  display:flex;
  align-items:center;
  width:22px; height:22px;
}
.link-btn .badge svg{ width:100%; height:100%; }

.socials{
  display:flex;
  justify-content:center;
  gap: 18px;
  margin-bottom: 18px;
}
.social-btn{
  width:56px; height:56px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  box-shadow: 0 6px 14px rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.4);
}
.social-btn img{ width:100%; height:100%; object-fit:cover; }

.footer-pill{
  display:block;
  text-align:center;
  font-size:12px;
  color:#fff;
  opacity:.75;
  letter-spacing:.4px;
}

@media (max-width:380px){
  .link-btn{ font-size:17px; padding:16px 16px; }
  .headline{ font-size: 28px; }
  .tagline{ letter-spacing:0; }
}
</style>
</head>
<body>
<div class="wrap">

  <img class="crest" src="logo.png" alt="TEA ESTATE — Finest Artisan Blends">

  <div class="card">
    <h1 class="headline">Where Heritage Blends and<br>Artisan Culinary Meet</h1>
    <p class="tagline">Premium Tea • Crafted Pizza • Specialty Coffee</p>

    <div class="links">

      <a class="link-btn" href="menu.html">
        MENU
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </span>
      </a>

      <a class="link-btn" href="https://maps.app.goo.gl/xSJJiiEkFreqcTB29?g_st=iw" target="_blank" rel="noopener">
        Riyadh Branch Location
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
      </a>

      <a class="link-btn" href="#">
        Our Store
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3h2.4l2.1 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
        </span>
      </a>

      <a class="link-btn" href="https://wa.me/966550706704" target="_blank" rel="noopener">
        Guest Care &amp; Support
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        </span>
      </a>

    </div>

    <div class="socials">
      <a class="social-btn" href="https://www.tiktok.com/@tea_estate" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="tiktok.jpeg" alt="TikTok">
      </a>
      <a class="social-btn" href="https://www.instagram.com/teaestate_sa/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="instagram.jpeg" alt="Instagram">
      </a>
      <a class="social-btn" href="https://www.snapchat.com/add/tea_estate" target="_blank" rel="noopener" aria-label="Snapchat">
        <img src="snapchat.jpeg" alt="Snapchat">
      </a>
    </div>

    <span class="footer-pill">2026 Powered by TEA ESTATE COMPANY</span>
  </div>

</div>
</body>
</html>
