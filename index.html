/* ===== Background — identical in index / menu / store =====
   iOS 26 Safari never draws position:fixed layers under its status bar / bottom toolbar
   (it fills those strips with one flat color). Only normal document content shows there.
   So the background has two layers, both sized ONLY from viewport units (never from
   content height, language or RTL/LTR), so they have the same scale and framing:
   - .bg-layer (fixed): the stationary background you see while scrolling.
   - .bg-doc (absolute, part of the document): sits behind it and is what Safari shows
     under its status bar / toolbar.
   On iOS only, a small top runway (--rw) + bottom bleed (--bl) give that document layer
   room to sit under the bars; a tiny script starts the page at scrollY = --rw, so the
   first screen looks exactly as before. */
:root{
  --bg-img:url('background.webp');
  --bg-w:max(100vw, calc(100lvh * 0.5625));   /* = cover width for a 1080x1920 image */
  --rw:0px;
  --bl:0px;
}
@supports (-webkit-touch-callout:none){        /* iPhone / iPad Safari only */
  :root{ --rw:72px; --bl:120px; }
  /* A fixed full-screen layer makes iOS 26 Safari paint a flat color strip under its
     status bar / toolbar ON TOP of .bg-doc. Removed completely (display:none, not
     opacity) so Safari shows the real image (.bg-doc) under its bars instead. */
  .bg-layer{ display:none; }
}
.bg-layer{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  direction:ltr;
}
.bg-layer-img{
  position:absolute;
  top:0; left:0; right:0;
  height:100vh;
  height:100lvh;
  min-height:100%;
  background:var(--bg-img) center top / cover no-repeat;
}
.bg-doc{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  z-index:-2;
  pointer-events:none;
  direction:ltr;
  background:
    var(--bg-img) center top / var(--bg-w) auto no-repeat,
    var(--bg-img) center bottom / var(--bg-w) auto no-repeat,
    #595737;
}

  transform: translateX(0);
  transition: transform .3s cubic-bezier(.65,0,.35,1);
  will-change: transform;
  pointer-events:none;
}
.lang-toggle[data-lang="ar"] .lang-thumb{ transform: translateX(100%); }

function setLang(lang){
  var t = translations[lang] || translations.en;

  document.getElementById('pageTitle').textContent = t.title;
  document.title = t.title;
  document.getElementById('crestImg').alt = t.crestAlt;
  document.getElementById('headline').textContent = t.headline;
  document.getElementById('subhead').textContent = t.subhead;
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('txt-menu').textContent = t.menu;
  document.getElementById('txt-location').textContent = t.location;
  document.getElementById('txt-store').textContent = t.store;
  document.getElementById('txt-support').textContent = t.support;
  document.getElementById('txt-footer').textContent = t.footer;

  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.documentElement.classList.toggle('lang-ar', lang === 'ar');

  document.getElementById('langToggle').setAttribute('data-lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');

  try{ localStorage.setItem('teaEstateLang', lang); }catch(e){}

  fitHeadline();
}

function fitHeadline(){
  var el = document.getElementById('headline');
  if(!el) return;
  el.style.fontSize = '';
  /* Don't fit while the headline font is still loading (text is invisible then):
     fitting the fallback font and refitting later moved the buttons ~13px (CLS). */
  var fam = document.documentElement.classList.contains('lang-ar') ? 'ArefRuqaa' : 'Froadmile';
  if(document.fonts && document.fonts.check && !document.fonts.check('16px ' + fam, el.textContent)){
    document.fonts.load('16px ' + fam, el.textContent).then(fitHeadline, function(){});
    return;
  }
  var maxFont = parseFloat(getComputedStyle(el).fontSize);
  var minFont = 14;
  var parent = el.parentElement;
  var parentStyle = getComputedStyle(parent);
  var paddingX = parseFloat(parentStyle.paddingLeft) + parseFloat(parentStyle.paddingRight);
  var containerWidth = parent.clientWidth - paddingX;
  var w = el.scrollWidth;
  if(w <= containerWidth) return;                       /* fits: nothing to do */
  /* text width scales with font size: jump straight to the fitting size, then fine-tune (0–2 steps) */
  var fontSize = Math.max(minFont, maxFont - Math.floor(maxFont - maxFont * containerWidth / w));  /* same 1px steps as before */
  el.style.fontSize = fontSize + 'px';
  while(fontSize + 1 <= maxFont){
    el.style.fontSize = (fontSize + 1) + 'px';
    if(el.scrollWidth > containerWidth){ el.style.fontSize = fontSize + 'px'; break; }
    fontSize++;
  }
  while(el.scrollWidth > containerWidth && fontSize > minFont){
    fontSize -= 1;
    el.style.fontSize = fontSize + 'px';
  }
}
/* iOS Safari fires resize every time its toolbar shows/hides while scrolling (height only).
   Only refit when the width really changes, once per frame. */
var fitW = window.innerWidth, fitRaf = 0;
window.addEventListener('resize', function(){
  if(window.innerWidth === fitW || fitRaf) return;
  fitRaf = requestAnimationFrame(function(){ fitRaf = 0; fitW = window.innerWidth; fitHeadline(); });
});
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(fitHeadline);
}

(function init(){
  var saved = 'en';
  try{ saved = localStorage.getItem('teaEstateLang') || 'en'; }catch(e){}
  var tg = document.getElementById('langToggle');
  tg.classList.add('no-anim');
  setLang(saved);
  void tg.offsetWidth;
  tg.classList.remove('no-anim');
})();
</script>

<script>
/* iOS: start just below the top runway so the background sits under Safari's status bar.
   Re-applied after load (some browsers reset scroll at load end), never after the user touches the page. */
(function(){
  var touched = false;
  var r = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rw')) || 0;  /* read once */
  function toRunway(){
    if(touched || !(r > 0)) return;
    if((window.scrollY || window.pageYOffset) < r) window.scrollTo(0, r);
  }
  window.addEventListener('touchstart', function(){ touched = true; }, {passive:true, once:true});
  document.addEventListener('touchstart', function(){}, {passive:true});
  toRunway();
  window.addEventListener('load', function(){ toRunway(); setTimeout(toRunway, 80); setTimeout(toRunway, 300); });
  window.addEventListener('pageshow', function(e){ if(e.persisted){ touched = false; } toRunway(); });
})();
</script>
<script>
(function(){
  function warm(){
    if(!document.fonts || !document.fonts.load) return;
    var c = navigator.connection; if(c && (c.saveData || /2g/.test(c.effectiveType||''))) return;
    ['16px Amiri','16px ArefRuqaa','16px Froadmile','16px Constantia'].forEach(function(f){
      document.fonts.load(f, f.indexOf('Amiri')>0||f.indexOf('Aref')>0 ? '\u0639' : 'A').catch(function(){});
    });
    var lang = document.documentElement.classList.contains('lang-ar') ? 'ar' : 'en';
    var im = new Image(); im.decoding = 'async'; im.src = 'menu-' + lang + '-1.webp';
  }
  function later(){ (window.requestIdleCallback || function(f){ setTimeout(f, 1200); })(warm, {timeout:3000}); }
  if(document.readyState === 'complete') later(); else window.addEventListener('load', later);
})();
</script>
