<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="pageTitle">TEA ESTATE — Finest Artisan Blends</title>
<meta name="description" content="Premium teas, artisanal pizzas, and specialty coffee. Menu, location and support for TEA ESTATE, Riyadh.">

<style>
@font-face{
  font-family:'Froadmile';
  src:url('Froadmile.ttf') format('truetype');
  font-display:swap;
}
@font-face{
  font-family:'Constantia';
  src:url('Constantia.ttf') format('truetype');
  font-display:swap;
}
@font-face{
  font-family:'Amiri';
  src:url('Amiri-Regular.ttf') format('truetype');
  font-display:swap;
}
@font-face{
  font-family:'ArefRuqaa';
  src:url('ArefRuqaa-Regular.ttf') format('truetype');
  font-display:swap;
}

:root{
  --ink:#2a1a10;
  --gold:#c8973f;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100svh;
  font-family:'Constantia', serif;
  color:#fff;
  background:#8a8f86 url('background.jpg') center top / cover no-repeat;
  display:flex;
  justify-content:center;
  padding: 40px 20px 50px;
}

.wrap{ width:100%; max-width:460px; position:relative; }
a{ text-decoration:none; color:inherit; }

/* Language toggle (scrolls away with the page, no longer fixed) */
.lang-toggle-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:14px;
  direction:ltr;
}
.lang-toggle{
  position:static;
  z-index:5;
  direction:ltr;
}
.lang-toggle-inner{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  background: rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.45);
  border-radius:999px;
  padding:4px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.lang-thumb{
  position:absolute;
  top:4px;
  bottom:4px;
  left:4px;
  width:calc((100% - 8px) / 2);
  border-radius:999px;
  background:#fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  transform: translateX(0);
  transition: transform .4s cubic-bezier(.65,0,.35,1);
  will-change: transform;
  pointer-events:none;
}
.lang-toggle[data-lang="ar"] .lang-thumb{ transform: translateX(100%); }
.lang-toggle.no-anim .lang-thumb,
.lang-toggle.no-anim .lang-btn{ transition:none !important; }
.lang-btn{
  position:relative;
  z-index:1;
  border:none;
  background:transparent;
  color:#fff;
  font-family:'Constantia', serif;
  font-size:13px;
  letter-spacing:.3px;
  padding:7px 14px;
  border-radius:999px;
  cursor:pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .3s ease;
}
.lang-btn.active{
  color:#2a1a10;
  font-weight:bold;
}

.crest{
  display:block;
  width: min(72%, 300px);
  margin: 4px auto -46px;
  filter: drop-shadow(0 12px 20px rgba(20,15,5,.35));
  position:relative;
  z-index:2;
}

.card{
  position:relative;
  z-index:1;
  padding: 70px 26px 34px;
  border-radius: 34px;
  background: linear-gradient(180deg, rgba(120,110,95,.42), rgba(90,82,70,.5));
  border: 1px solid rgba(255,255,255,.25);
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  text-align:center;
}

.headline{
  font-family:'Froadmile', 'Constantia', serif;
  font-size: clamp(30px, 8vw, 42px);
  line-height:1.15;
  color:#1c130a;
  margin: 0 0 14px;
  text-shadow: 0 1px 0 rgba(255,255,255,.15);
  white-space: nowrap;
  display:block;
}

.subhead{
  font-size: clamp(9px, 2.9vw, 13px);
  letter-spacing: 1px;
  text-transform: uppercase;
  color:#fdf6ea;
  margin: 0 0 16px;
  text-shadow: 0 1px 6px rgba(0,0,0,.35);
  white-space: nowrap;
}

.tagline{
  font-size: clamp(10px, 3.4vw, 15px);
  letter-spacing:.1px;
  color:#fdf6ea;
  margin: 0 0 28px;
  text-shadow: 0 1px 6px rgba(0,0,0,.35);
  white-space: nowrap;
}

.links{ display:flex; flex-direction:column; gap:16px; margin-bottom: 26px; }

.link-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding: 18px 20px;
  border-radius: 999px;
  font-family:'Constantia', serif;
  font-size: 19px;
  color:#fff;
  background: linear-gradient(180deg, rgba(214,161,90,.85), rgba(198,133,60,.85));
  border: 1px solid rgba(255,255,255,.35);
  box-shadow: 0 8px 18px rgba(0,0,0,.18);
  transition: transform .15s ease, box-shadow .15s ease;
}
.link-btn:active{ transform: scale(.98); }

.link-btn .badge{
  position:absolute;
  left: 20px;
  display:flex;
  align-items:center;
  width:22px; height:22px;
}
.link-btn .badge svg{ width:100%; height:100%; }

.socials{
  display:flex;
  justify-content:center;
  gap: 18px;
  margin-bottom: 18px;
}
.social-btn{
  width:56px; height:56px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  box-shadow: 0 6px 14px rgba(0,0,0,.25);
  border: 1px solid rgba(255,255,255,.4);
}
.social-btn img{ width:100%; height:100%; object-fit:cover; }

.footer-pill{
  display:block;
  text-align:center;
  font-size:12px;
  color:#fff;
  opacity:.75;
  letter-spacing:.4px;
}

@media (max-width:380px){
  .link-btn{ font-size:17px; padding:16px 16px; }
  .headline{ font-size: 28px; }
}

/* ===== Arabic / RTL mode ===== */
html.lang-ar body{ direction: rtl; }
html.lang-ar .headline{ font-family:'ArefRuqaa','Amiri', serif; }
html.lang-ar .subhead{ letter-spacing:0; text-transform:none; font-family:'Amiri', serif; font-size: clamp(11px, 3.4vw, 15px); }
html.lang-ar .tagline{ font-family:'Amiri', serif; font-size: clamp(12px, 3.8vw, 16px); }
html.lang-ar .link-btn{ font-family:'Amiri', serif; }
html.lang-ar .footer-pill{ font-family:'Amiri', serif; }
html.lang-ar .link-btn .badge{ left:auto; right:20px; }
</style>
</head>
<body>

<div class="wrap">

  <div class="lang-toggle-row">
    <div class="lang-toggle" id="langToggle" data-lang="en" role="group" aria-label="Language">
      <div class="lang-toggle-inner">
      <span class="lang-thumb" aria-hidden="true"></span>
      <button type="button" id="btn-en" class="lang-btn" onclick="setLang('en')">EN</button>
      <button type="button" id="btn-ar" class="lang-btn" onclick="setLang('ar')">عربي</button>
      </div>
    </div>
  </div>

  <img id="crestImg" class="crest" src="logo.png" alt="TEA ESTATE — Finest Artisan Blends">

  <div class="card">
    <h1 class="headline" id="headline">The Original Source of Pure Teas</h1>
    <p class="subhead" id="subhead">PURE HERITAGE | FINEST ARTISAN BLENDS</p>
    <p class="tagline" id="tagline">Premium Tea • Crafted Pizza • Specialty Coffee</p>

    <div class="links">

      <a class="link-btn" href="menu.html">
        <span id="txt-menu">MENU</span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </span>
      </a>

      <a class="link-btn" href="https://maps.app.goo.gl/xSJJiiEkFreqcTB29?g_st=iw" target="_blank" rel="noopener">
        <span id="txt-location">Riyadh Branch Location</span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
      </a>

      <a class="link-btn" href="store.html">
        <span id="txt-store">Our Store</span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3h2.4l2.1 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21.5 7H6"/></svg>
        </span>
      </a>

      <a class="link-btn" href="https://wa.me/966550706704" target="_blank" rel="noopener">
        <span id="txt-support">Guest Care &amp; Support</span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
        </span>
      </a>

    </div>

    <div class="socials">
      <a class="social-btn" href="https://www.tiktok.com/@tea_estate" target="_blank" rel="noopener" aria-label="TikTok">
        <img src="tiktok.jpeg" alt="TikTok">
      </a>
      <a class="social-btn" href="https://www.instagram.com/teaestate_sa/" target="_blank" rel="noopener" aria-label="Instagram">
        <img src="instagram.jpeg" alt="Instagram">
      </a>
      <a class="social-btn" href="https://www.snapchat.com/add/tea_estate" target="_blank" rel="noopener" aria-label="Snapchat">
        <img src="snapchat.jpeg" alt="Snapchat">
      </a>
    </div>

    <span class="footer-pill" id="txt-footer">2026 Powered by TEA ESTATE COMPANY</span>
  </div>

</div>

<script>
var translations = {
  en: {
    title: "TEA ESTATE — Finest Artisan Blends",
    crestAlt: "TEA ESTATE — Finest Artisan Blends",
    headline: "The Original Source of Pure Teas",
    subhead: "PURE HERITAGE | FINEST ARTISAN BLENDS",
    tagline: "Premium Tea • Crafted Pizza • Specialty Coffee",
    menu: "MENU",
    location: "Riyadh Branch Location",
    store: "Our Store",
    support: "Guest Care & Support",
    footer: "2026 Powered by TEA ESTATE COMPANY"
  },
  ar: {
    title: "تي استيت — أجود الخلطات الحرفية",
    crestAlt: "تي استيت — أجود الخلطات الحرفية",
    headline: "المصدر الأصلي للشاي النقي",
    subhead: "تراث أصيل | أجود الخلطات الحرفية",
    tagline: "شاي فاخر • بيتزا حرفية • قهوة مختصة",
    menu: "المنيو",
    location: "موقع فرع الرياض",
    store: "المتجر",
    support: "خدمة العملاء",
    footer: "يتم تشغيله بواسطة شركة تي استيت 2026"
  }
};

function setLang(lang){
  var t = translations[lang] || translations.en;

  document.getElementById('pageTitle').textContent = t.title;
  document.title = t.title;
  document.getElementById('crestImg').alt = t.crestAlt;
  document.getElementById('headline').textContent = t.headline;
  document.getElementById('subhead').textContent = t.subhead;
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('txt-menu').textContent = t.menu;
  document.getElementById('txt-location').textContent = t.location;
  document.getElementById('txt-store').textContent = t.store;
  document.getElementById('txt-support').textContent = t.support;
  document.getElementById('txt-footer').textContent = t.footer;

  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.documentElement.classList.toggle('lang-ar', lang === 'ar');

  document.getElementById('langToggle').setAttribute('data-lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');

  try{ localStorage.setItem('teaEstateLang', lang); }catch(e){}

  fitHeadline();
}

function fitHeadline(){
  var el = document.getElementById('headline');
  if(!el) return;
  el.style.fontSize = '';
  var maxFont = parseFloat(getComputedStyle(el).fontSize);
  var minFont = 14;
  var containerWidth = el.parentElement.clientWidth;
  var fontSize = maxFont;
  while(el.scrollWidth > containerWidth && fontSize > minFont){
    fontSize -= 1;
    el.style.fontSize = fontSize + 'px';
  }
}
window.addEventListener('resize', fitHeadline);

(function init(){
  var saved = 'en';
  try{ saved = localStorage.getItem('teaEstateLang') || 'en'; }catch(e){}
  var tg = document.getElementById('langToggle');
  tg.classList.add('no-anim');
  setLang(saved);
  void tg.offsetWidth;
  tg.classList.remove('no-anim');
})();
</script>

</body>
</html>
