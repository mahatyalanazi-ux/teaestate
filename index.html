/* ===== Background — identical in index / menu / store =====
   ONE layer (.bg), ONE copy of background.webp. Size/position come only from viewport and
   document geometry, never from language or text direction.
   - Desktop / Chrome / Android: .bg is position:fixed → stationary cover image (unchanged look).
   - iOS (WebKit): Safari 26+ never paints fixed/sticky layers under its status bar or toolbar.
     It shows scrolling document pixels there, or (at scrollY = 0) a flat fill taken from body's
     background-color; theme-color is ignored. So on iOS .bg is a normal document layer that
     scrolls with the page and covers the whole document:
       --bg-runway = status-bar safe area (device value, 0 in landscape). A one-time scroll to it
                     puts real image pixels under the status bar; the first screen frames like Chrome.
       --bg-bleed  = Safari's retractable toolbar height (100lvh - 100svh), so the image always
                     continues under the bottom toolbar, even at the end of the page.
   --bg-edge = the image's top-edge sky colour: what Safari fills the status strip with at scrollY 0. */
:root{
  --bg-img:url('background.webp');
  --bg-edge:#b7b29a;
  --bg-runway:0px;
  --bg-bleed:0px;
}
html{
  background-color:var(--bg-edge);
  overscroll-behavior-y:none;
}
body{
  position:relative;     /* containing block for .bg on iOS */
  z-index:0;             /* .bg (z -1) paints above body's colour, below all content */
  margin:var(--bg-runway) 0 var(--bg-bleed);
  background-color:var(--bg-edge);
}
.bg{
  position:fixed;
  top:0; left:0; right:0;
  height:100vh;
  height:100lvh;
  min-height:100%;
  z-index:-1;
  pointer-events:none;
  direction:ltr;         /* crop never depends on AR/EN direction */
  background:var(--bg-img) center top / cover no-repeat;
}
@supports (-webkit-touch-callout:none){        /* iOS / iPadOS WebKit */
  :root{
    --bg-runway:env(safe-area-inset-top, 0px);
    --bg-bleed:calc(100lvh - 100svh);
  }
  .bg{
    position:absolute;
    top:0;
    bottom:calc(0px - var(--bg-bleed));
    height:auto;
    min-height:0;
  }
}

function setLang(lang){
  var t = translations[lang] || translations.en;

  document.getElementById('pageTitle').textContent = t.title;

  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.documentElement.classList.toggle('lang-ar', lang === 'ar');

  document.getElementById('langToggle').setAttribute('data-lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');

  try{ localStorage.setItem('teaEstateLang', lang); }catch(e){}

  fitHeadline();
}

function fitHeadline(){
  var el = document.getElementById('headline');
  if(!el) return;
  el.style.fontSize = '';
  /* Don't fit while the headline font is still loading (text is invisible then):
     fitting the fallback font and refitting later moved the buttons ~13px (CLS). */
  var fam = document.documentElement.classList.contains('lang-ar') ? 'ArefRuqaa' : 'Froadmile';
  if(document.fonts && document.fonts.check && !document.fonts.check('16px ' + fam, el.textContent)){
    document.fonts.load('16px ' + fam, el.textContent).then(fitHeadline, function(){});
    return;
  }
  var maxFont = parseFloat(getComputedStyle(el).fontSize);
  var minFont = 14;
  var parent = el.parentElement;
  var parentStyle = getComputedStyle(parent);
  var paddingX = parseFloat(parentStyle.paddingLeft) + parseFloat(parentStyle.paddingRight);
  var containerWidth = parent.clientWidth - paddingX;
  var w = el.scrollWidth;
  if(w <= containerWidth) return;                       /* fits: nothing to do */
  /* text width scales with font size: jump straight to the fitting size, then fine-tune (0–2 steps) */
  var fontSize = Math.max(minFont, maxFont - Math.floor(maxFont - maxFont * containerWidth / w));  /* same 1px steps as before */
  el.style.fontSize = fontSize + 'px';
  while(fontSize + 1 <= maxFont){
    el.style.fontSize = (fontSize + 1) + 'px';
    if(el.scrollWidth > containerWidth){ el.style.fontSize = fontSize + 'px'; break; }
    fontSize++;
  }
  while(el.scrollWidth > containerWidth && fontSize > minFont){
    fontSize -= 1;
    el.style.fontSize = fontSize + 'px';
  }
}
/* iOS Safari fires resize every time its toolbar shows/hides while scrolling (height only).
   Only refit when the width really changes, once per frame. */

window.addEventListener('resize', function(){
  if(window.innerWidth === fitW || fitRaf) return;
  fitRaf = requestAnimationFrame(function(){ fitRaf = 0; fitW = window.innerWidth; fitHeadline(); });
});
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(fitHeadline);
}

  window.addEventListener('touchstart', function(){ touched = true; }, {passive:true, once:true});
  seat();
  window.addEventListener('load', seat, {once:true});
})();

  }
  function later(){ (window.requestIdleCallback || function(f){ setTimeout(f, 1200); })(warm, {timeout:3000}); }
