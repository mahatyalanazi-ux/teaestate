<style>
*{ box-sizing:border-box; }

html{
  -webkit-text-size-adjust:100%;
  min-height:100%;
  /* Fallback only (seen if Safari ever paints its own band): image edge colors, never gray */
  background:#c3ae92 linear-gradient(180deg,#c3ae92 0%,#595737 100%);
  overscroll-behavior-y:none;
  position:relative;
}

body{
  margin:var(--rw) 0 var(--bl);
  min-height:100svh;
  background:transparent;
  overflow-x:hidden;
  padding:
    max(12px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
}

/* ===== Background — identical in index / menu / store =====
   iOS 26 Safari never draws position:fixed layers under its status bar / bottom toolbar
   (it fills those strips with one flat color). Only normal document content shows there.
   So the background has two layers, both sized ONLY from viewport units (never from
   content height, language or RTL/LTR), so they have the same scale and framing:
   - .bg-layer (fixed): the stationary background you see while scrolling.
   - .bg-doc (absolute, part of the document): sits behind it and is what Safari shows
     under its status bar / toolbar.
   On iOS only, a small top runway (--rw) + bottom bleed (--bl) give that document layer
   room to sit under the bars; a tiny script starts the page at scrollY = --rw, so the
   first screen looks exactly as before. */
:root{
  --bg-img:url('background.webp');
  --bg-w:max(100vw, calc(100lvh * 0.5625));   /* = cover width for a 1080x1920 image */
  --rw:0px;
  --bl:0px;
}
@supports (-webkit-touch-callout:none){        /* iPhone / iPad Safari only */
  :root{ --rw:72px; --bl:120px; }
  /* A fixed full-screen layer makes iOS 26 Safari paint a flat color strip under its
     status bar / toolbar ON TOP of .bg-doc. Removed completely (display:none, not
     opacity) so Safari shows the real image (.bg-doc) under its bars instead. */
  .bg-layer{ display:none; }
}
.bg-layer{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  direction:ltr;
}
.bg-layer-img{
  position:absolute;
  top:0; left:0; right:0;
  height:100vh;
  height:100lvh;
  min-height:100%;
  background:var(--bg-img) center top / cover no-repeat;
}
.bg-doc{
  position:absolute;
  top:0; right:0; bottom:0; left:0;
  z-index:-2;
  pointer-events:none;
  direction:ltr;
  background:
    var(--bg-img) center top / var(--bg-w) auto no-repeat,
    var(--bg-img) center bottom / var(--bg-w) auto no-repeat,
    #595737;
}

/* Menu column: near full width on phones, capped on iPad/desktop */
.viewer{
  width:100%;
  max-width:900px;
  margin:0 auto;
  border-radius:14px;
  overflow:hidden;
  background:#f1efe8;
  box-shadow:0 12px 36px rgba(0,0,0,.35);
}

/* Pages stack seamlessly, original ratio, never cropped */
.viewer img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:auto 1920 / 2215;   /* keeps every page's box stable before its file arrives */
  max-width:100%;
  margin:0;
  border:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

/* ===================== Pick up CTA + bottom sheet (feature block) =====================
   Isolated: nothing above this line was changed except one hook line in render().
   iOS 26 Safari note: Safari reads background-color / backdrop-filter of FIXED elements
   near the screen edges to tint its toolbar. So the fixed wrapper (.pickup-bar) is fully
   transparent; the green lives on the button inside it. The overlay is display:none
   (hidden attribute) while closed so it can never tint the toolbar. */
/* Constantia: full file only for rare glyphs (Greek, Cyrillic, extended Latin, symbols);
   the small Latin subset below covers all current text, so normally only it downloads. */
@font-face{
  font-family:'Constantia';
  src:url('Constantia.woff2') format('woff2'), url('Constantia.woff') format('woff'), url('Constantia.ttf') format('truetype');
  font-display:swap;
  unicode-range:U+0100-024F,U+02B0-02FF,U+0300-03FF,U+0400-04FF,U+1E00-1EFF,U+2070-209F,U+20A0-20CF,U+2100-27BF,U+FB00-FB04;
}
@font-face{
  font-family:'Constantia';
  src:url('Constantia-latin.woff2') format('woff2'), url('Constantia.woff') format('woff');
  font-display:swap;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Amiri';
  src:url('Amiri-Regular.woff2') format('woff2'), url('Amiri-Regular.woff') format('woff'), url('Amiri-Regular.ttf') format('truetype');
  font-display:swap;
}
:root{
  --pk-green:#658144;
  --pk-green-dark:#566f39;
  --pk-h:46px;                                            /* button height */
  --pk-gap:max(16px, env(safe-area-inset-bottom, 0px));    /* distance from screen bottom */
}

/* fixed, transparent wrapper: centered, never wider than the screen */
.pickup-bar{
  position:fixed;
  left:0; right:0;
  bottom:var(--pk-gap);
  z-index:10;                       /* page layers are -2 / -1 / auto */
  display:flex;
  justify-content:center;
  padding:0 max(24px, env(safe-area-inset-left, 0px)) 0 max(24px, env(safe-area-inset-right, 0px));
  pointer-events:none;
}
.pickup-btn{
  pointer-events:auto;
  -webkit-appearance:none;
  appearance:none;
  width:min(66vw, 300px);
  min-width:min(244px, 100%);
  max-width:100%;
  height:var(--pk-h);
  margin:0;
  padding:0 24px;
  border:0;
  border-radius:999px;
  background:var(--pk-green);
  color:#fff;
  font-family:'Constantia', Georgia, serif;
  font-size:20px;
  line-height:1;
  letter-spacing:.2px;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.12) inset;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease, background-color .15s ease;
}
.pickup-btn:hover{ background:var(--pk-green-dark); }
.pickup-btn:active{ transform:scale(.98); transition-duration:0s; }
.pickup-btn:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
.pickup-btn[lang="ar"]{ font-family:'Amiri', 'Times New Roman', serif; font-size:21px; }

/* keep the last menu page reachable above the button (only the missing space is added;
   body already has a bottom padding and, on iPhone, the --bl bleed) */
main.viewer{
  margin-bottom:calc(var(--pk-h) + 28px);
  margin-bottom:max(0px, calc(var(--pk-h) + var(--pk-gap) + 12px - max(24px, env(safe-area-inset-bottom, 0px)) - var(--bl)));
}

/* overlay + bottom sheet */
.pickup-overlay{
  position:fixed;
  inset:0;
  z-index:20;                       /* above the button and the page */
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0 max(12px, env(safe-area-inset-right, 0px)) var(--pk-gap) max(12px, env(safe-area-inset-left, 0px));
  background:rgba(20,18,12,.45);
  opacity:0;
  transition:opacity .22s ease;
  overscroll-behavior:contain;
}
.pickup-overlay[hidden]{ display:none; }
.pickup-overlay.is-open{ opacity:1; }

.pickup-sheet{
  position:relative;
  width:100%;
  max-width:420px;
  padding:22px 18px 18px;
  border-radius:24px;
  background:#f1efe8;
  color:#2a1a10;
  box-shadow:0 14px 40px rgba(0,0,0,.3);
  font-family:'Constantia', Georgia, serif;
  transform:translateY(24px);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.pickup-overlay.is-open .pickup-sheet{ transform:translateY(0); }
.pickup-sheet[lang="ar"]{ font-family:'Amiri', 'Times New Roman', serif; }

.pickup-title{
  margin:0 40px 16px;
  text-align:center;
  font-size:19px;
  font-weight:normal;
  line-height:1.3;
}
.pickup-close{
  position:absolute;
  top:12px;
  inset-inline-end:12px;
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(42,26,16,.07);
  color:#2a1a10;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.pickup-close svg{ width:16px; height:16px; }
.pickup-close{ transition:background-color .15s ease; }
.pickup-close:active{ background:rgba(42,26,16,.16); transition-duration:0s; }

.pickup-options{ display:flex; flex-direction:column; gap:10px; }
.pickup-opt{
  display:flex;
  align-items:center;
  gap:12px;
  height:56px;
  padding:0 16px;
  border-radius:16px;
  background:#fff;
  border:1px solid rgba(42,26,16,.08);
  color:#2a1a10;
  text-decoration:none;
  font-size:18px;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease;
}
.pickup-opt:hover{ background:#faf8f2; }
.pickup-opt:active{ background:#f4f1e8; transition-duration:0s; }
.pickup-ico{
  flex:0 0 36px;
  width:36px; height:36px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff;
}
.pickup-ico svg{ width:20px; height:20px; display:block; }
.pickup-ico.wa{ background:#25d366; }
.pickup-ico.call{ background:var(--pk-green); }
.pickup-close:focus-visible,
.pickup-opt:focus-visible{ outline:2px solid var(--pk-green); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
  .pickup-btn, .pickup-overlay, .pickup-sheet{ transition:none; }
  .pickup-sheet{ transform:none; }
}
/* ===== Tap feedback (performance pass) =====
   Press state applies instantly (0s); only the release eases back. No delay before navigation. */
a, button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
/* ===================== Back to home (copied from store.html .back-btn) =====================
   Same declarations as Store. Only additions: font-family + text-decoration (Store gets them
   from body / its global a{} rule, which menu.html doesn't have) and z-index 15 so the
   Pick-up sheet (z 20) still covers it while open; the Pick-up bar is z 10 at the bottom. */
.back-btn{
  position:fixed;
  top:16px;
  left:16px;
  direction:ltr;
  z-index:15;
  display:flex;
  align-items:center;
  gap:6px;
  padding:9px 14px 9px 10px;
  border-radius:999px;
  font-family:'Constantia', serif;
  font-size:14px;
  color:#fff;
  text-decoration:none;
  background: rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.back-btn svg{ width:16px; height:16px; }
.back-btn{ transition: transform .15s ease; }
.back-btn:active{ transform: scale(.96); transition-duration:0s; }
@media (prefers-reduced-motion: reduce){ .back-btn{ transition:none; } }
</style>

<script>
/* Add new menu pages here, in display order. Paths are relative to this file. */
var menus = {
  en: [
    "menu-en-1.webp",
    "menu-en-2.webp",
    "menu-en-3.webp",
    "menu-en-4.webp"
  ],
  ar: [
    "menu-ar-1.webp",
    "menu-ar-2.webp",
    "menu-ar-3.webp",
    "menu-ar-4.webp"
  ]
};

/* Native size of every page image (keeps layout stable while loading) */
var PAGE_W = 1920, PAGE_H = 2215;

var currentLang = null;

function getLang(){
  var l = 'en';
  try{ l = localStorage.getItem('teaEstateLang') || 'en'; }catch(e){}
  return (l === 'ar') ? 'ar' : 'en';
}

function render(){
  var lang = getLang();
  if(lang === currentLang) return;   /* nothing changed */
  currentLang = lang;

  var viewer = document.getElementById('viewer');
  viewer.textContent = '';

  document.documentElement.lang = lang;
  document.title = (lang === 'ar') ? 'تي استيت — المنيو' : 'TEA ESTATE — Menu';
  viewer.setAttribute('aria-label', (lang === 'ar') ? 'المنيو' : 'Menu');
  if(window.pickupSetLang) window.pickupSetLang(lang);   /* Pick up CTA */
  document.getElementById('txt-back').textContent = (lang === 'ar') ? 'رجوع' : 'Back';   /* Back to home */
  document.getElementById('backLink').setAttribute('aria-label', (lang === 'ar') ? 'العودة إلى الصفحة الرئيسية' : 'Back to TEA ESTATE home');

  var alt = (lang === 'ar') ? 'منيو تي استيت' : 'TEA ESTATE menu';
  var pages = menus[lang];
  var later = [], first = null;

  for(var i = 0; i < pages.length; i++){
    var img = new Image();
    img.width = PAGE_W;
    img.height = PAGE_H;
    img.alt = alt + ' ' + (i + 1) + '/' + pages.length;
    img.decoding = 'async';
    img.draggable = false;
    if(i === 0){
      img.loading = 'eager';
      img.setAttribute('fetchpriority', 'high');
    }else if(i === 1){
      img.loading = 'eager';
    }else{
      img.loading = 'lazy';
      img.setAttribute('fetchpriority', 'low');
    }
    if(i < 2) img.src = pages[i]; else later.push([img, pages[i]]);
    viewer.appendChild(img);
    if(i === 0) first = img;
  }
  function startRest(){ for(var k = 0; k < later.length; k++) later[k][0].src = later[k][1]; later = []; }
  if(first.complete) startRest();
  else { first.addEventListener('load', startRest, {once:true}); first.addEventListener('error', startRest, {once:true}); }
}

render();

/* Re-check language when coming back to this page (back button / bfcache / tab switch) */
window.addEventListener('pageshow', render);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) render();
});
window.addEventListener('storage', function(e){
  if(e.key === 'teaEstateLang') render();
});
</script>

<script>
/* ===== Pick up CTA + bottom sheet ===== */
(function(){
  var T = {
    en:{ btn:'Pick-Up Service', title:'Pick-Up Service', wa:'WhatsApp', call:'Call', close:'Close' },
    ar:{ btn:'خدمة الاستلام من الفرع', title:'خدمة الاستلام من الفرع', wa:'واتساب', call:'اتصال', close:'إغلاق' }
  };
  var btn = document.getElementById('pickupBtn');
  var overlay = document.getElementById('pickupOverlay');
  var sheet = document.getElementById('pickupSheet');
  var closeBtn = document.getElementById('pickupClose');
  var closeTimer = null;

  /* Called by render() whenever the page language is applied */
  window.pickupSetLang = function(lang){
    var t = T[lang] || T.en;
    var dir = (lang === 'ar') ? 'rtl' : 'ltr';
    btn.textContent = t.btn;
    btn.lang = lang; btn.dir = dir;
    sheet.lang = lang; sheet.dir = dir;
    document.getElementById('pickupTitle').textContent = t.title;
    document.getElementById('pickupWaTxt').textContent = t.wa;
    document.getElementById('pickupCallTxt').textContent = t.call;
    closeBtn.setAttribute('aria-label', t.close);
  };
  window.pickupSetLang((typeof currentLang === 'string' && currentLang) ? currentLang : 'en');

  function focusables(){
    return sheet.querySelectorAll('a[href], button:not([disabled])');
  }
  function isOpen(){ return !overlay.hidden && overlay.classList.contains('is-open'); }

  function open(){
    if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
    overlay.hidden = false;
    void overlay.offsetWidth;                 /* let the closed state paint, then animate */
    overlay.classList.add('is-open');
    btn.setAttribute('aria-expanded', 'true');
    var first = focusables()[0];
    if(first) first.focus({ preventScroll:true });
  }
  function close(){
    if(overlay.hidden) return;
    overlay.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    closeTimer = setTimeout(function(){ overlay.hidden = true; closeTimer = null; }, reduce ? 0 : 230);
    btn.focus({ preventScroll:true });
  }

  btn.setAttribute('aria-expanded', 'false');
  btn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });

  /* close after choosing an option (link still opens normally) */
  document.getElementById('pickupWa').addEventListener('click', function(){ setTimeout(close, 0); });
  document.getElementById('pickupCall').addEventListener('click', function(){ setTimeout(close, 0); });

  /* Escape + focus trap */
  document.addEventListener('keydown', function(e){
    if(!isOpen()) return;
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key === 'Tab'){
      var f = focusables(), first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* Block page scroll only while open, without touching html/body styles
     (keeps the current Safari background fixes and the scroll position intact) */
  function block(e){ if(isOpen()) e.preventDefault(); }
  overlay.addEventListener('touchmove', block, { passive:false });
  overlay.addEventListener('wheel', block, { passive:false });

  /* coming back from WhatsApp / phone app: make sure the sheet is closed */
  window.addEventListener('pageshow', function(){ if(!overlay.hidden){ overlay.classList.remove('is-open'); overlay.hidden = true; } });
})();
</script>

<script>
/* iOS: start just below the top runway so the background sits under Safari's status bar.
   Re-applied after load (some browsers reset scroll at load end), never after the user touches the page. */
(function(){
  var touched = false;
  var r = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rw')) || 0;  /* read once */
  function toRunway(){
    if(touched || !(r > 0)) return;
    if((window.scrollY || window.pageYOffset) < r) window.scrollTo(0, r);
  }
  window.addEventListener('touchstart', function(){ touched = true; }, {passive:true, once:true});
  document.addEventListener('touchstart', function(){}, {passive:true});
  toRunway();
  window.addEventListener('load', function(){ toRunway(); setTimeout(toRunway, 80); setTimeout(toRunway, 300); });
  window.addEventListener('pageshow', function(e){ if(e.persisted){ touched = false; } toRunway(); });
})();
</script>
